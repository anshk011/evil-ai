version: "3.8"

services:
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-gateway
    restart: unless-stopped
    ports:
      - "20128:20128"
    environment:
      - PORT=20128

  vader-gem-bot:
    build: .
    container_name: vader-gem-bot
    restart: unless-stopped
    depends_on:
      - omniroute
    env_file:
      - .env
    volumes:
      - ./telegram_bot.log:/app/telegram_bot.log
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
